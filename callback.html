<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oura Auth Callback</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    h1 { color: #333; }
    .code { background: #f5f5f5; padding: 15px; border-radius: 8px; word-break: break-all; margin: 20px 0; }
    .label { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Oura Authorization</h1>
  <p class="label">Authorization Code:</p>
  <div class="code" id="code">Loading...</div>
  <p class="label">State:</p>
  <div class="code" id="state">-</div>
  <script>
    const params = new URLSearchParams(window.location.hash.substring(1));
    const code = params.get('code') || new URLSearchParams(window.location.search).get('code') || 'NOT FOUND';
    const state = params.get('state') || new URLSearchParams(window.location.search).get('state') || '-';
    document.getElementById('code').textContent = code;
    document.getElementById('state').textContent = state;
  </script>
</body>
</html>
