<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Google OAuth 回调</title>
<style>
body { font-family: sans-serif; background: #1a1a2e; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
.card { background: #16213e; padding: 40px; border-radius: 12px; text-align: center; max-width: 600px; }
h2 { margin-top: 0; color: #e91e63; }
code { background: #0f3460; padding: 12px 20px; border-radius: 6px; font-size: 14px; word-break: break-all; display: block; margin: 20px 0; color: #00d2ff; }
.note { font-size: 13px; color: #888; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
<h2>✅ 授权成功</h2>
<p>请复制下面的授权码，发给 Hermes：</p>
<code id="code">正在获取...</code>
<p class="note">复制以上代码，粘贴到飞书/聊天窗口发送给 Hermes Agent</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
document.getElementById('code').textContent = code || '未获取到 code';
if (code) {
  document.getElementById('code').textContent = decodeURIComponent(code);
}
</script>
</body>
</html>
